<main class="review view-both" id="review">
  <header class="review-head">
    <div class="brand"><div class="brandmark"><svg class="icon"><use href="#i-home"/></svg></div><div><h1>화면 미리보기</h1><p>자녀 · 보호자</p></div></div>
    <div class="preview-label"><span></span>UI 목업 · 모든 내용은 예시</div>
  </header>
  <div class="toolbar">
    <div class="segmented" role="group" aria-label="검토할 사용자 화면">
      <button class="active" data-view="both" aria-pressed="true">나란히 보기</button><button data-view="child" aria-pressed="false">자녀 화면</button><button data-view="guardian" aria-pressed="false">보호자 화면</button>
    </div>
    <nav class="shortcuts" aria-label="화면 바로보기"><button data-preview="location">위치 공유 흐름</button><button data-preview="stickers">칭찬판</button><button data-preview="onboarding">첫 실행 안내</button></nav>
  </div>
  <div class="devices">
    <section class="device-wrap child-wrap" aria-label="자녀 앱 목업"><div class="device-label"><strong>자녀 화면</strong><small>대화 안에서 간편하게</small></div><div class="phone" id="child-phone"></div></section>
    <section class="device-wrap guardian-wrap" aria-label="보호자 앱 목업"><div class="device-label"><strong>보호자 화면</strong><small>기록을 한눈에 확인</small></div><div class="phone" id="guardian-phone"></div></section>
  </div>
  <footer class="review-foot"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>자녀 대화에서 정확히 ‘설정’을 보내면 설정 메뉴가 열려요. 실제 전송·위치 수집 없이 화면에서만 동작합니다.</span></footer>
</main>
<script>
(()=>{
'use strict';
const root=document.getElementById('review');
const $=(s,p=root)=>p.querySelector(s);
const icon=(name)=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escape=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={child:'chat',guardian:'location',balance:8,sharing:true,requests:[],awards:[{reason:'도착했다고 먼저 알려 줘서 고마워!',time:'어제 16:10'},{reason:'학교 준비물을 스스로 챙겼어요',time:'9월 19일 08:20'}],messages:[{sender:'child',text:'아빠! 학교 끝났어 😊',time:'14:55'},{sender:'guardian',text:'수고했어! 학원 다녀오고\n횡단보도에서는 꼭 멈춰서 살펴봐 💛',time:'14:56'},{sender:'child',text:'응 알겠어! 끝나면 위치 보내줄게',time:'14:56'},{sender:'guardian',text:'좋아. 아빠는 집에 있어 🏠',time:'14:57'}],locationSent:false};
state.rewards=[{id:1,name:'아빠랑 아이스크림 먹기',cost:5,emoji:'🍦'},{id:2,name:'주말 영화 고르기',cost:10,emoji:'🎬'}];
state.nextRewardId=3;state.editRewardId=null;state.selectedRewardId=null;
const timers={};
let sheetCounter=0;
function statusbar(){return `<div class="statusbar"><span>15:25</span><div class="status-icons">${icon('signal')}${icon('wifi')}${icon('battery')}</div></div>`}
function top(){return ''}
function nav(role){if(role==='child'||['settings','onboarding'].includes(state[role]))return '';const tabs=[['chat','chat','대화'],...(role==='guardian'?[['location','pin','자녀 위치']]:[]),['stickers','star','칭찬판']];return `<nav class="nav" aria-label="${role==='child'?'자녀':'보호자'} 메뉴">${tabs.map(([key,glyph,label])=>`<button class="${state[role]===key?'active':''}" data-page="${key}" data-role="${role}" aria-current="${state[role]===key?'page':'false'}"><span class="nav-icon">${icon(glyph)}</span><span>${label}${key==='stickers'&&role==='guardian'&&state.requests.some(r=>r.status==='pending')?'<span class="badge-number">1</span>':''}</span></button>`).join('')}</nav>`}
function render(role){const phone=document.getElementById(role+'-phone');phone.innerHTML=statusbar()+top(role)+`<div class="app-body ${state[role]==='chat'?'chat-body':''}" id="${role}-body">${({chat:chat,location:locationPage,stickers:stickers,settings:settings,onboarding:onboarding})[state[role]](role)}</div>`+nav(role)+'<div class="homebar" aria-hidden="true"></div>';}
function renderAll(){render('child');render('guardian')}
function locationBubble(){return `<div class="location-mini"><span class="map-pin">${icon('pin')}</span><span class="example">지도 예시</span></div><div class="bubble-location">${icon('pin')}현재 위치를 공유했어요</div><span class="location-detail">우리 동네 횡단보도 앞<br>15:25 측정 · 오차 약 12m</span>`}
function bubbles(role){return state.messages.filter(m=>!m.local||role==='child').map(m=>{const mine=m.sender===role;return `<div class="bubble-row ${mine?'mine':''}">${mine?`<span class="bubble-time">${m.time}</span>`:''}<div>${!mine?`<div class="bubble-name">${role==='child'?'아빠':'우리 아이'}</div>`:''}<div class="bubble">${m.type==='location'?locationBubble():escape(m.text).replace(/\n/g,'<br>')}</div>${m.local?'<div class="command-note">내 설정 메뉴</div>':''}</div>${!mine?`<span class="bubble-time">${m.time}</span>`:''}</div>`}).join('')}
function chat(role){return `<div class="recipient"><div class="avatar ${role==='child'?'dad':''}">${icon(role==='child'?'heart':'star')}</div><div><strong>${role==='child'?'아빠':'우리 아이'}</strong></div>${role==='child'?`<button class="sticker-launch" data-action="stickers-popup" data-role="child" aria-label="칭찬판 열기, 스티커 ${state.balance}개">${icon('star')}<span>칭찬판</span><span class="count">${state.balance}</span></button>`:''}</div><div class="chat-log" id="${role}-chat-log"><div class="date-divider">9월 21일 월요일</div>${bubbles(role)}</div>${role==='child'?`<div class="quick-messages"><button data-quick="지금 출발했어!" data-role="child">출발했어 👋</button><button data-quick="도착했어!" data-role="child">도착했어 🏠</button><button data-quick="아빠, 전화해 줘" data-role="child">전화해 줘</button></div><button class="share-location" data-action="share" data-role="child">${icon('locate')}현재 위치 공유<small>한 번만 보내요</small></button>`:''}<form class="composer" data-role="${role}"><input aria-label="${role==='child'?'아빠에게':'자녀에게'} 보낼 메시지" placeholder="마음을 담아 보내요" maxlength="1500" autocomplete="off"><button type="submit" aria-label="메시지 보내기">${icon('send')}</button></form>`}
function map(){return `<div class="map-picture"><svg viewBox="0 0 348 220" role="img" aria-label="학교와 집 사이의 가상 동네 지도, 실제 지형이 아닌 목업"><rect width="348" height="220" fill="#e9eedf"/><g fill="#d6e1c9"><rect x="11" y="42" width="72" height="42" rx="9"/><rect x="219" y="145" width="115" height="61" rx="13"/><rect x="114" y="146" width="64" height="67" rx="9"/></g><g fill="#e1ddcd" stroke="#d6d1c1" stroke-width="1"><rect x="113" y="20" width="43" height="46" rx="6"/><rect x="177" y="21" width="57" height="45" rx="6"/><rect x="274" y="17" width="49" height="60" rx="5"/><rect x="7" y="152" width="62" height="48" rx="5"/><rect x="165" y="104" width="38" height="25" rx="4"/></g><path d="M-20 119 365 82M90-20 108 241M244-15 256 234" stroke="#d3dacb" stroke-width="25" fill="none"/><path d="M-20 119 365 82M90-20 108 241M244-15 256 234" stroke="#fffef8" stroke-width="21" fill="none"/><path d="M99 61 101 108 247 94 250 140" stroke="#83a792" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round" fill="none"/><circle cx="248" cy="109" r="32" fill="#317d5320"/><circle cx="248" cy="109" r="22" fill="#317d5317"/><circle cx="248" cy="109" r="13" fill="#245b46" stroke="white" stroke-width="4"/><text x="42" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#668052">예시 학교</text><text x="183" y="42" font-family="sans-serif" font-size="10" fill="#8d8775">예시 학원</text><text x="275" y="178" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6f875c">동네 공원</text><g transform="translate(89 47)"><rect width="22" height="22" rx="7" fill="white" stroke="#dce3d4"/><path d="m5 10 6-5 6 5m-10-1v8h8V9" stroke="#648268" stroke-width="1.5" fill="none"/></g><g transform="translate(222 71)"><rect width="50" height="21" rx="7" fill="#245b46"/><text x="25" y="14" fill="white" font-family="sans-serif" font-size="10" text-anchor="middle">우리 아이</text></g></svg><div class="map-caption">지도 표시 예시 · 실제 지형 아님</div><div class="map-controls"><button data-action="map" data-role="guardian" aria-label="지도 확대 예시">${icon('plus')}</button><button data-action="map" data-role="guardian" aria-label="지도 축소 예시">${icon('minus')}</button></div></div>`}
function locationPage(){const events=[['15:05','pin','5분 자동 위치 기록','학원 앞 · 위치 오차 약 14m',false],['15:06:12','up','올라가기 시작','높이가 올라가기 시작했어요',true],['15:06:48','up','올라가기 종료','상대 높이 +6.2m · 이동 약 36초',true],['15:22:03','down','내려가기 시작','높이가 내려가기 시작했어요',true],['15:22:42','down','내려가기 종료','상대 높이 −6.0m · 이동 약 39초',true],['15:25','pin',state.locationSent?'현재 위치 직접 공유':'5분 자동 위치 기록','횡단보도 앞 · 위치 오차 약 12m',false]];return `<div class="scroll-page"><div class="location-status">${icon('shield')}<span>${state.sharing?'자동 공유 설정 켜짐':'자동 공유 설정 꺼짐'}</span><span class="meta">${icon('battery').replace('class="icon"','class="icon" style="display:inline-block;vertical-align:-3px;width:15px"')} 68% · 예시</span></div><div class="card map-card">${map()}<div class="map-info"><div class="row">${icon('pin')}<strong>우리 동네 횡단보도 앞</strong><span class="pill">${state.locationSent?'직접 공유':'자동 기록'}</span></div><div class="subline">마지막 측정 15:25 · 오차 약 12m</div></div></div><div class="timeline-heading"><h3>오늘의 이동 기록</h3><span class="meta">9월 21일</span></div><div class="timeline">${events.map(([time,glyph,title,desc,vertical])=>`<div class="event"><span class="event-icon ${vertical?'vertical':''}">${icon(glyph)}</span><div class="event-main"><strong>${title}</strong>${vertical?'<span class="pill gold">추정</span>':''}<p>${desc}</p></div><time>${time}</time></div>`).join('')}</div><div class="note">움직임이 있는 5분 구간마다 위치를 기록해요.<br>오르내림은 별도로 기록하며, 정확한 층수를 뜻하지 않아요.</div></div>`}
function stickers(role,popup=false){const pending=state.requests.filter(r=>r.status==='pending');return `<div class="scroll-page">${popup?'':'<h2 class="page-title">차곡차곡, 칭찬판</h2><p class="page-sub">작은 노력도 반짝이는 별이 돼요.</p>'}<div class="sticker-summary"><div class="small">지금 모은 칭찬</div><div class="sticker-count">${state.balance}<span>개</span></div><div class="sticker-grid">${Array.from({length:12},(_,i)=>`<span class="sticker-dot ${i<state.balance?'filled':''}">${icon('star')}</span>`).join('')}</div><p>${state.balance>=12?'칭찬이 가득 찼어요. 정말 잘했어요!':'하나씩 쌓이는 마음, 참 잘하고 있어요.'}</p></div><button class="primary full" data-action="${role==='guardian'?'award':'reward-select'}" data-role="${role}">${icon(role==='guardian'?'plus':'gift')}${role==='guardian'?'칭찬 스티커 1개 주기':'모은 스티커 사용하기'}</button>${state.requests.length?`<h3 class="mini-title">${role==='guardian'&&pending.length?'아이의 사용 요청':'스티커 사용 기록'}</h3>${state.requests.map((r,i)=>`<div class="card"><div class="row"><div class="reward-image">${escape(r.emoji||"🎁")}</div><div class="grow"><strong style="font-size:13px">${escape(r.reward)}</strong><div class="small">스티커 ${r.cost}개</div></div><span class="pill ${r.status==='pending'?'gold':''}">${r.status==='pending'?'확인 대기':r.status==='approved'?'사용 완료':'다시 의논해요'}</span></div>${role==='guardian'&&r.status==='pending'?`<div class="approve-actions"><button class="secondary" data-decision="reject" data-index="${i}">다시 의논하기</button><button class="primary" data-decision="approve" data-index="${i}">사용 승인</button></div>`:''}</div>`).join('')}`:''}<div class="timeline-heading"><h3>우리의 약속</h3>${role==='guardian'?'<button class="text-btn" data-action="rewards-manage" data-role="guardian" aria-label="우리의 약속 관리">관리</button>':''}</div><div class="card">${rewardItems(role)}</div><h3 class="mini-title">도착한 칭찬</h3>${state.awards.map(a=>`<div class="card praise">${icon('star')}<div><strong>${escape(a.reason)}</strong><p>아빠가 스티커 1개를 보냈어요 · ${a.time}</p></div></div>`).join('')}</div>`}

function rewardItems(role,manage=false){
  if(!state.rewards.length)return `<p class="empty-rewards">${role==='guardian'?'아이와 함께 첫 약속을 정해 보세요.':'아빠와 약속을 정해 보세요.'}</p>`;
  return state.rewards.map(r=>`<div class="reward-item"><div class="reward-image">${escape(r.emoji)}</div><div class="grow"><strong>${escape(r.name)}</strong><small>스티커 ${r.cost}개</small></div>${manage?`<button data-action="reward-edit" data-role="guardian" data-reward-id="${r.id}" aria-label="${escape(r.name)} 수정">수정</button>`:role==='child'?`<button data-action="redeem" data-role="child" data-reward-id="${r.id}" ${r.cost>state.balance?'disabled':''}>${r.cost>state.balance?`${r.cost-state.balance}개 더 모아요`:'사용하기'}</button>`:icon('gift')}</div>`).join('');
}
function rewardsManage(){return `<p class="menu-intro">아이와 함께 정한 선물과 스티커 개수예요.</p><div class="card">${rewardItems('guardian',true)}</div><button class="primary full" data-action="reward-add" data-role="guardian">${icon('plus')}약속 추가</button>`}
function rewardEditor(){const reward=state.rewards.find(r=>r.id===state.editRewardId);return `<form class="reward-editor" data-role="guardian" novalidate><label for="promise-name">선물 이름</label><input id="promise-name" name="name" maxlength="60" value="${escape(reward?.name||'')}" placeholder="예: 아빠랑 아이스크림 먹기" autocomplete="off"><label for="promise-cost">필요한 스티커 개수</label><div class="cost-input"><input id="promise-cost" name="cost" type="number" inputmode="numeric" min="1" max="999" step="1" value="${reward?.cost||5}"><span>개</span></div><p class="field-hint">이만큼 모으면 선물을 요청할 수 있어요.</p><p id="promise-error" class="form-error" role="alert"></p><button class="primary full" type="submit">저장</button><button class="text-btn" type="button" data-action="rewards-manage" data-role="guardian">취소</button>${reward?'<button class="text-btn delete-reward" type="button" data-action="reward-delete" data-role="guardian">이 약속 삭제</button>':''}</form>`}
function saveReward(){const name=$('#promise-name').value.trim(),cost=Number($('#promise-cost').value);if(!name||name.length>60||!Number.isInteger(cost)||cost<1||cost>999){$('#promise-error').textContent='선물 이름과 스티커 1~999개를 입력해 주세요.';return}const reward=state.rewards.find(r=>r.id===state.editRewardId);if(reward){reward.name=name;reward.cost=cost}else state.rewards.push({id:state.nextRewardId++,name,cost,emoji:'🎁'});closeSheet('guardian');renderAll();sheet('guardian','rewards-manage')}

function settings(role,section='location'){if(section==='info')return `<div class="card">${bullet('pin','위치와 측정 시각','GPS 좌표, 측정 시각, 위치 정확도')}${bullet('up','올라가고 내려가는 움직임','기압으로 추정한 높이 변화와 시작·종료 시각')}${bullet('shield','연결된 보호자에게만','가족 중계 서버와 텔레그램을 통해 전달')}</div><div class="note">위치·대화 기록은 서버 운영자가 삭제할 때까지 보관돼요. 앱 연결을 해제해도 기존 기록은 삭제되지 않아요. 텔레그램 기록은 별도로 관리해요.</div>`;if(section==='family')return `<div class="card"><div class="setting-row"><span class="small">내 역할</span><strong style="font-size:13px">자녀</strong></div><div class="setting-row"><span class="small">연결 상태</span><span class="pill neutral">UI 목업 · 실제 연결 없음</span></div><button class="text-btn" data-action="onboarding" data-role="child">${icon('info')}처음 안내 다시 보기</button></div>`;return `<div class="card"><div class="setting-row"><div><strong>자동 위치 공유</strong><p>움직일 때 5분 간격으로 아빠에게 알려요.</p></div><button class="toggle ${state.sharing?'on':''}" role="switch" aria-label="자동 위치 공유" aria-checked="${state.sharing}" data-action="toggle" data-role="child"></button></div><div class="setting-info"><p>공유 중에는 휴대폰에 알림이 표시돼요. 언제든 이 설정이나 알림에서 끌 수 있어요.</p><p>현재 위치를 한 번 보내는 기능은 대화 화면에서 별도로 사용할 수 있어요.</p></div></div>`}
function settingsMenu(){return `<p class="menu-intro">원하는 항목을 골라 주세요.</p><div class="popup-menu"><button data-action="settings-location" data-role="child">${icon('locate')}<span><strong>자동 위치 공유</strong><small>현재 ${state.sharing?'켜짐':'꺼짐'} · 공유 켜기 / 끄기</small></span><span class="chevron">›</span></button><button data-action="settings-info" data-role="child">${icon('shield')}<span><strong>공유 정보 안내</strong><small>공유하는 정보와 기록 보관</small></span><span class="chevron">›</span></button><button data-action="settings-family" data-role="child">${icon('heart')}<span><strong>가족 연결</strong><small>연결 상태 · 처음 안내 다시 보기</small></span><span class="chevron">›</span></button></div>`}
function bullet(glyph,title,desc){return `<div class="bullet-info">${icon(glyph)}<div><strong>${title}</strong><p>${desc}</p></div></div>`}
function onboarding(role){return `<div class="scroll-page onboarding"><div class="onboarding-mark">${icon('home')}</div><h2>오는 길을 함께<br>알 수 있어요.</h2><p class="small">앱을 시작하기 전에<br>아빠와 함께 읽어 주세요.</p><div class="card">${bullet('chat','대화하면서 위치를 보낼 수 있어요','대화의 ‘현재 위치 공유’를 누르면 그때의 위치를 한 번 아빠에게 보내요.')}${bullet('locate','자동 공유는 따로 켜요','동의하고 켜면 화면이 꺼져 있어도 움직임이 있는 5분 구간마다 위치를 기록해요.')}${bullet('up','오르내리는 움직임도 알려요','기압으로 올라가기·내려가기의 시작과 종료를 추정해요. 정확한 층수는 알 수 없어요.')}${bullet('shield','공유 중임을 항상 알려요','휴대폰 알림에 표시하고, 언제든 공유를 끌 수 있어요. 정보는 중계 서버와 텔레그램을 거쳐 아빠에게 전달돼요.')}</div><label class="consent-check"><input type="checkbox" data-consent="${role}"><span>아빠와 자녀가 위 내용을 함께 확인했어요.</span></label><button class="primary full" data-action="finish-onboarding" data-role="${role}" disabled>확인하고 시작하기</button><p class="meta" style="text-align:center;margin-top:13px">UI 목업에서는 실제 권한을 요청하지 않아요.</p></div>`}
function toast(role,text){const phone=document.getElementById(role+'-phone');$('.toast',phone)?.remove();clearTimeout(timers[role]);const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=icon('check')+`<span>${escape(text)}</span>`;phone.appendChild(el);timers[role]=setTimeout(()=>el.remove(),3800)}
function notification(text,detail){const phone=document.getElementById('guardian-phone');$('.notification',phone)?.remove();const el=document.createElement('div');el.className='notification';el.setAttribute('role','status');el.innerHTML=`<span class="avatar" style="width:35px;height:35px;border-radius:11px">${icon('pin')}</span><div class="grow"><strong>${escape(text)}</strong><span class="small">${escape(detail)}</span></div><button data-action="notification-map" data-role="guardian">지도 보기</button>`;phone.appendChild(el);setTimeout(()=>el.remove(),6500)}
function scrollChat(role){const log=document.getElementById(role+'-chat-log');if(log)log.scrollTop=log.scrollHeight}
function addMessage(role,text){if(!text.trim())return;const isSettingsCommand=role==='child'&&text==='설정';state.messages.push({sender:role,text:text,time:'15:25',local:isSettingsCommand});for(const r of ['child','guardian'])if(state[r]==='chat'){render(r);scrollChat(r)}if(isSettingsCommand)sheet('child','settings-menu')}
function closeSheet(role){const phone=document.getElementById(role+'-phone');$('.sheet-layer',phone)?.remove();phone.querySelectorAll('[data-modal-inert]').forEach(el=>{el.removeAttribute('inert');el.removeAttribute('data-modal-inert')});const opener=phone._opener;if(opener?.isConnected)opener.focus();else $('.sticker-launch,.composer input',phone)?.focus()}
function sheet(role,type){root.querySelectorAll('.sheet-layer').forEach(layer=>closeSheet(layer.dataset.role));const phone=document.getElementById(role+'-phone');phone._opener=document.activeElement;[...phone.children].forEach(el=>{if(!el.hasAttribute('inert')){el.setAttribute('inert','');el.setAttribute('data-modal-inert','')}});const layer=document.createElement('div');layer.className='sheet-layer';layer.dataset.role=role;layer.dataset.type=type;const titleId='sheet-title-'+(++sheetCounter);let content='';if(type==='award')content=`<div class="sheet-icon" style="background:var(--yellow);color:var(--gold)">${icon('star')}</div><h2 id="${titleId}">어떤 점이 기특했나요?</h2><p>칭찬 한마디와 함께<br>스티커 한 개를 전해요.</p><label for="award-reason">칭찬하고 싶은 일</label><textarea id="award-reason" rows="3" maxlength="200" placeholder="도착했다고 알려 줘서 고마워!">도착했다고 먼저 알려 줘서 고마워!</textarea><button class="primary full" data-action="confirm-award" data-role="${role}">${icon('star')}스티커 1개 주기</button>`;if(type==='redeem'){const reward=state.rewards.find(r=>r.id===state.selectedRewardId);content=reward?`<div class="sheet-icon">${icon('gift')}</div><h2 id="${titleId}">이 약속으로 바꿀까요?</h2><div class="card selected-reward"><div class="reward-image">${escape(reward.emoji)}</div><strong>${escape(reward.name)}</strong><span>스티커 ${reward.cost}개</span></div><p>지금 모은 스티커 ${state.balance}개<br>아빠가 승인하면 ${reward.cost}개가 사용돼요.</p><button class="primary full" data-action="confirm-redeem" data-role="child" ${reward.cost>state.balance?'disabled':''}>아빠에게 사용 요청하기</button>`:`<h2 id="${titleId}">약속이 바뀌었어요</h2><p>칭찬판에서 다시 골라 주세요.</p>`}if(type==='consent')content=`<div class="sheet-icon">${icon('shield')}</div><h2 id="${titleId}">자동 위치를 공유할까요?</h2><p>움직임이 있는 5분 구간마다 위치와 시각을 아빠에게 보내요. 올라가기·내려가기의 시작과 종료도 추정해서 알려드려요.</p><div class="note">화면이 꺼져 있어도 공유가 계속돼요.<br>휴대폰 알림에서 공유 상태를 볼 수 있고,<br>언제든 종료할 수 있어요.</div><p style="font-size:11px;margin-top:14px">정보는 중계 서버와 텔레그램을 거쳐 전달돼요.</p><button class="primary full" data-action="confirm-sharing" data-role="${role}">동의하고 공유 켜기</button>`;const popupTitles={'rewards-manage':'우리의 약속','reward-edit':state.editRewardId===null?'약속 추가':'약속 수정','reward-select':'어떤 약속으로 바꿀까요?',stickers:'칭찬판','settings-menu':'설정','settings-location':'자동 위치 공유','settings-info':'공유 정보 안내','settings-family':'가족 연결',onboarding:'처음 함께 읽기'};if(popupTitles[type]){if(type==='rewards-manage')content=rewardsManage();else if(type==='reward-edit')content=rewardEditor();else if(type==='reward-select')content=`<p class="menu-intro">지금 모은 스티커 ${state.balance}개</p><div class="card">${rewardItems('child')}</div>`;else if(type==='stickers')content=stickers(role,true);else if(type==='settings-menu')content=settingsMenu();else if(type.startsWith('settings-'))content=settings(role,type.slice(9));else content=onboarding(role);layer.innerHTML=`<section class="sheet popup-sheet" role="dialog" aria-modal="true" aria-labelledby="${titleId}"><div class="sheet-handle"></div><header class="popup-head">${type==='reward-edit'?`<button class="icon-btn" data-action="rewards-manage" data-role="guardian" aria-label="약속 목록으로 돌아가기">${icon('back')}</button>`:''}${type.startsWith('settings-')&&type!=='settings-menu'?`<button class="icon-btn" data-action="settings-menu" data-role="${role}" aria-label="설정 메뉴로 돌아가기">${icon('back')}</button>`:''}<h2 id="${titleId}">${popupTitles[type]}</h2><button class="icon-btn" data-action="close-sheet" data-role="${role}" aria-label="팝업 닫기">${icon('close')}</button></header><div class="popup-content">${content}</div></section>`}else layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="${titleId}"><div class="sheet-handle"></div>${content}<button class="text-btn" data-action="close-sheet" data-role="${role}">나중에</button></section>`;phone.appendChild(layer);layer.addEventListener('click',e=>{if(e.target===layer)closeSheet(role)});layer.querySelector('textarea,input,button')?.focus();}
function setView(view){root.querySelectorAll('.sheet-layer').forEach(layer=>closeSheet(layer.dataset.role));root.className='review view-'+view;root.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))})}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const role=b.dataset.role||'child',action=b.dataset.action;if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.preview){const p=b.dataset.preview;state.child='chat';if(p==='location')state.guardian='location';if(p==='stickers')state.guardian='stickers';renderAll();if(p==='onboarding'){setView('child');sheet('child',p)}else if(p==='stickers'&&!root.classList.contains('view-guardian'))sheet('child',p);return}if(b.dataset.page){state[role]=b.dataset.page;render(role);return}if(b.dataset.quick){addMessage(role,b.dataset.quick);return}if(b.dataset.decision){const request=state.requests[Number(b.dataset.index)];if(!request||request.status!=='pending')return;if(b.dataset.decision==='approve'){if(request.cost>state.balance){toast('guardian','모은 스티커가 부족해요.');return}state.balance-=request.cost;request.status='approved'}else request.status='rejected';renderAll();toast('guardian',request.status==='approved'?'스티커 사용을 승인했어요.':'아이와 다시 이야기해 주세요.');return}switch(action){case 'stickers-popup':sheet('child','stickers');break;case 'settings-menu':case 'settings-location':case 'settings-info':case 'settings-family':sheet('child',action);break;case 'back':state[role]='chat';render(role);break;case 'onboarding':sheet(role,'onboarding');break;case 'finish-onboarding':closeSheet(role);state[role]='chat';render(role);toast(role,'함께 확인했어요. 대화를 시작해 볼까요?');break;case 'share':b.disabled=true;b.innerHTML=icon('locate')+'현재 위치를 확인하고 있어요…';setTimeout(()=>{state.locationSent=true;state.messages.push({sender:'child',type:'location',time:'15:25'});render('child');scrollChat('child');render('guardian');toast('child','아빠한테 위치 알람이 갔습니다.');notification('아이의 현재 위치가 도착했어요','15:25 · 횡단보도 앞 · 예시 위치')},650);break;case 'notification-map':state.guardian='location';render('guardian');break;case 'map':toast('guardian','UI 목업에서는 지도 화면만 확인할 수 있어요.');break;case 'award':sheet(role,'award');break;case 'reward-select':sheet('child','reward-select');break;case 'rewards-manage':if(role==='guardian')sheet(role,'rewards-manage');break;case 'reward-add':if(role==='guardian'){state.editRewardId=null;sheet(role,'reward-edit')}break;case 'reward-edit':if(role==='guardian'){state.editRewardId=Number(b.dataset.rewardId);sheet(role,'reward-edit')}break;case 'reward-delete':if(role==='guardian'){state.rewards=state.rewards.filter(r=>r.id!==state.editRewardId);closeSheet(role);renderAll();sheet(role,'rewards-manage')}break;case 'redeem':state.selectedRewardId=Number(b.dataset.rewardId);sheet('child','redeem');break;case 'toggle':if(role!=='child')return;if(state.sharing){state.sharing=false;closeSheet(role);renderAll();sheet('child','settings-location')}else sheet('child','consent');break;case 'confirm-sharing':state.sharing=true;closeSheet(role);renderAll();sheet('child','settings-location');break;case 'close-sheet':{const type=$('.sheet-layer',document.getElementById(role+'-phone'))?.dataset.type;if(role==='child'&&(type==='redeem'||type==='reward-select'))sheet('child','stickers');else if(type==='consent')sheet('child','settings-location');else closeSheet(role);break}case 'confirm-award':{const reason=$('#award-reason').value.trim();if(!reason){$('#award-reason').focus();return}state.balance++;state.awards.unshift({reason,time:'오늘 15:25'});closeSheet(role);renderAll();toast('guardian','칭찬 스티커 1개를 보냈어요.');break}case 'confirm-redeem':{const reward=state.rewards.find(r=>r.id===state.selectedRewardId);if(!reward||reward.cost>state.balance)return;state.requests.unshift({reward:reward.name,cost:reward.cost,emoji:reward.emoji,status:'pending'});closeSheet(role);renderAll();sheet('child','stickers');break}}});
root.addEventListener('submit',e=>{if(e.target.matches('.reward-editor')){e.preventDefault();saveReward();return}if(!e.target.matches('.composer'))return;e.preventDefault();const input=$('input',e.target);addMessage(e.target.dataset.role,input.value)});
root.addEventListener('change',e=>{if(e.target.dataset.consent){const role=e.target.dataset.consent;$(`[data-action="finish-onboarding"][data-role="${role}"]`).disabled=!e.target.checked}});
root.addEventListener('keydown',e=>{const layer=root.querySelector('.sheet-layer');if(!layer)return;if(e.key==='Escape'){closeSheet(layer.dataset.role);return}if(e.key==='Tab'){const focusable=[...layer.querySelectorAll('button:not([disabled]),input,textarea')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
renderAll();if(window.matchMedia('(max-width:740px)').matches)setView('child');
})();
</script>
</body>
</html>
